[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthome_robot"
version = "0.1.6"
description = "Helper library for Smart Home League"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [ { name = "Sina Arshad", email = "sina.arshad@hotmail.com" } ]
keywords = ["robot", "webots", "smart-home", "league"]
classifiers = [
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "flake8"]

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/smart-home-league/smarthome_robot"
Issues = "https://github.com/smart-home-league/smarthome_robot/issues"
